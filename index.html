function startQuiz(mode){
 const rid=++QR,used=new Set(),items=[];
 D.filter(d=>QS.has(d.l)).forEach(d=>{const a=d.x.find(p=>p[0]&&p[1]&&!used.has(p[0]))||d.x[0];used.add(a[0]);items.push({w:a[0],r:a[1]})});
 const qs=sh(items),total=qs.length,pass=Math.ceil(total*2/3);let n=0,s=0;
 function show(){
  if(rid!=QR)return;
  if(n>=total){const w=s>=pass;(w?win:lose)();
   app.innerHTML=`<div class="q"><div class="box"><div class="big">${w?"🏆":"🌧️"} ${s}/${total}</div><p>${w?"Omedetou! Hebat sekali, kamu juara! 🎺":"Belum sampai "+pass+". Ganbarou, coba lagi! 🎺"}</p><button class="go" id="again">Main lagi</button><button class="go" id="other" style="background:#fff">Pilih bab lain</button></div></div>`;
   app.querySelector("#again").onclick=()=>startQuiz(mode);app.querySelector("#other").onclick=()=>quiz(mode);return}
  const q=qs[n],key=mode=="m"?"w":"r",qk=mode=="m"?"r":"w",seen=new Set([q[key]]),ds=[];
  for(const x of sh(items)){if(ds.length>=3)break;if(x===q||x.w==q.w||x.r==q.r||seen.has(x[key]))continue;seen.add(x[key]);ds.push(x)}
  const o=sh([q,...ds]);
  app.innerHTML=`<div class="q"><div class="box"><div class="bar"><i style="width:${n/total*100}%"></i></div><div class="ask">${n+1} / ${total}</div><div class="big">${q[qk]}</div><div class="opts">${o.map((x,i)=>`<button style="background:${P2[i]}" data-v="${x[key]}">${x[key]}</button>`).join("")}</div><div class="msg"></div></div></div>`;
  app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
   const ok=b.dataset.v==q[key];if(ok)s++;(ok?sOK:sNO)();
   app.querySelectorAll(".opts button").forEach(x=>{x.disabled=true;const c=x.dataset.v==q[key];if(c||x===b){x.style.background="";x.classList.add(c?"ok":"bad")}else x.classList.add("dim")});
   app.querySelector(".msg").textContent=ok?pick(OK):pick(NO)+" Jawaban: "+q[key];
   n++;setTimeout(show,1800)});
 }
 show();
}
